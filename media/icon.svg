<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4da6ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="128" height="128" rx="20" fill="url(#gradient)" stroke="#333" stroke-width="3"/>
  
  <!-- 文档轮廓 -->
  <rect x="30" y="25" width="68" height="78" rx="5" fill="#fff" fill-opacity="0.9"/>
  
  <!-- 文档内容线条 -->
  <rect x="40" y="40" width="48" height="8" fill="#4da6ff"/>
  <rect x="40" y="55" width="40" height="5" fill="#4da6ff" fill-opacity="0.7"/>
  <rect x="40" y="65" width="32" height="5" fill="#4da6ff" fill-opacity="0.7"/>
  <rect x="40" y="75" width="40" height="5" fill="#4da6ff" fill-opacity="0.7"/>
  <rect x="40" y="85" width="28" height="5" fill="#4da6ff" fill-opacity="0.7"/>
  
  <!-- 搜索放大镜 -->
  <circle cx="85" cy="75" r="15" fill="none" stroke="#ff6b6b" stroke-width="5"/>
  <line x1="95" y1="85" x2="105" y2="95" stroke="#ff6b6b" stroke-width="5"/>
  
  <!-- 交集符号（两个重叠的圆圈） -->
  <circle cx="50" cy="75" r="20" fill="#ffa64d" fill-opacity="0.6"/>
  <circle cx="65" cy="75" r="20" fill="#66cc66" fill-opacity="0.6"/>
  
  <!-- 高亮交集区域 -->
  <path d="M55,75 a15,15 0 1,1 0.1,0" fill="#fff" fill-opacity="0.8"/>
  
  <!-- 关键词符号 -->
  <circle cx="47" cy="60" r="3" fill="#0066cc"/>
  <circle cx="55" cy="60" r="3" fill="#0066cc"/>
  <circle cx="63" cy="60" r="3" fill="#0066cc"/>
</svg>